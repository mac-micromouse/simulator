<!DOCTYPE html>
<html>
	<head>
		<title>Micromouse Simulator</title>
		<meta charset="utf-8">
		<meta name="viewport" content="max-width=device-width, initial-scale=1.0">
		<meta name="description" content="Write C++ code to control a simulated ESP32, and make your own maze-solving robot">
		<meta rel="canonical" href="https://macmouse.ca/simulator">

		<script src="https://cdnjs.cloudflare.com/ajax/libs/showdown/2.1.0/showdown.min.js"></script>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/default.min.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
		<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/languages/cpp.min.js"></script>

		<script src="js/ace/ace.js"></script>
		<script src="js/ace/ext-language_tools.js"></script>
		<script src="js/ace/mode-c_cpp.js"></script>
		<script src="js/ace/theme-one_dark.js"></script>

		<script src="js/interface/SerialInterface.js"></script>
		<script src="js/interface/EditorInterface.js"></script>
		<script src="js/interface/OptionsInterface.js"></script>
		<script src="js/interface/Interface.js"></script>

		<script src="js/util.js"></script>
		<script src="js/Maze.js"></script>
		<script src="js/Sensor.js"></script>
		<script src="js/Bot.js"></script>
		<script src="js/Simulator.js"></script>
		<script src="js/main.js"></script>
		
		<link rel="stylesheet" href="css/index.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
	</head>
	<body>
		<div id="container">
			<div id="container-left">
				<div class="section-header">
					<div id="left-top" class="section-header-items">
						<div class="section-header-elem selected" id="tab-editor"><span class="fa fa-code"></span> Editor</div>
						<div class="section-header-elem" id="tab-documentation"><span class="fa fa-book"></span> Documentation</div>
						<div class="section-header-elem" id="tab-examples"><span class="fa fa-list-ul"></span> Examples</div>
					</div>
					<div class="section-header-buttons">
						<div class="section-header-button" id="save-button"><span class="fa fa-check"></span></div>
					</div>
				</div>
				<div class="left-tab" id="editor-container">
					<div class="section-header small">
						<div class="section-header-items">
							<div id="files-list">
								<div class="section-header-elem selected">bot.cpp</div>
							</div>
							<div class="section-header-button" id="button-add-file" title="Add file"><span class="fa fa-plus"></span></div>
						</div>
					</div>
					<div id="code-editor"></div>
				</div>
				<div class="left-tab" id="documentation-container"></div>
				<div class="left-tab" id="examples-container">
					<h1>Examples</h1>
					<div id="examples-listing"></div>
				</div>
			</div>
			<div id="container-right">
				<div class="section-header">
					<div id="right-top" class="section-header-items">
						<div class="section-header-elem selected" id="tab-simulation"><span class="fa fa-bolt"></span> Simulation</div>
						<div class="section-header-elem" id="tab-options"><span class="fa fa-gear"></span> Options</div>
					</div>
					<div class="section-header-buttons">
						<div class="section-header-button" id="button-maze" title="Generate new maze"><span class="fa fa-dice"></span></div>
						<div class="section-header-button" id="button-restart" title="Restart"><span class="fa fa-arrow-rotate-right"></span></div>
						<div class="section-header-button" id="button-compile" title="Compile and run"><span class="fa fa-play"></span></div>
					</div>
				</div>
				<div class="right-tab" id="simulation-container">
					<canvas></canvas>
					<div id="serial-interface">
						<div class="section-header">
							<div class="section-header-items">
								<div class="section-header-elem selected"><span class="fa fa-terminal"></span> Serial Monitor</div>
							</div>
							<div class="section-header-buttons">
								<div class="section-header-button" id="button-clear" title="Clear serial monitor"><span class="fa fa-trash"></span></div>
							</div>
						</div>
						<div id="serial-interface-log"></div>
					</div>
				</div>
				<div class="right-tab" id="options-container">

				</div>
			</div>
		</div>
	</body>
</html>
