<!DOCTYPE html>
<html>
	<head>
		<script src="js/ace/ace.js"></script>
		<script src="js/ace/ext-language_tools.js"></script>
		<script src="js/ace/mode-c_cpp.js"></script>
		<script src="js/ace/theme-one_dark.js"></script>

		<script src="js/interface/SerialInterface.js"></script>
		<script src="js/interface/EditorInterface.js"></script>
		<script src="js/interface/Interface.js"></script>

		<script src="js/util.js"></script>
		<script src="js/Maze.js"></script>
		<script src="js/Sensor.js"></script>
		<script src="js/Bot.js"></script>
		<script src="js/Simulator.js"></script>
		<script src="js/main.js"></script>
		
		<link rel="stylesheet" href="css/index.css">
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
	</head>
	<body>
		<div id="container">
			<div id="container-left">
				<div class="section-header">
					<div class="section-header-items">
						<div class="section-header-elem selected"><span class="fa fa-code"></span> Editor</div>
						<div class="section-header-elem"><span class="fa fa-book"></span> Documentation</div>
						<div class="section-header-elem"><span class="fa fa-list-ul"></span> Examples</div>
					</div>
					<div class="section-header-buttons">
						<div class="section-header-button" id="save-button"><span class="fa fa-check"></span></div>
					</div>
				</div>
				<div id="code-editor"></div>
			</div>
			<div id="container-right">
				<div class="section-header">
					<div class="section-header-items">
						<div class="section-header-elem selected"><span class="fa fa-bolt"></span> Simulation</div>
						<div class="section-header-elem"><span class="fa fa-gear"></span> Bot Options</div>
					</div>
					<div class="section-header-buttons">
						<div class="section-header-button" id="button-maze" title="Generate new maze"><span class="fa fa-dice"></span></div>
						<div class="section-header-button" id="button-restart" title="Restart"><span class="fa fa-arrow-rotate-right"></span></div>
						<div class="section-header-button" id="button-compile" title="Compile and run"><span class="fa fa-play"></span></div>
					</div>
				</div>
				<canvas></canvas>
				<div id="serial-interface">
					<div class="section-header">
						<div class="section-header-items">
							<div class="section-header-elem selected"><span class="fa fa-terminal"></span> Serial Monitor</div>
						</div>
						<div class="section-header-buttons">
							<div class="section-header-button" id="button-clear" title="Clear serial monitor"><span class="fa fa-trash"></span></div>
						</div>
					</div>
					<div id="serial-interface-log"></div>
				</div>
			</div>
		</div>
	</body>
</html>
